post:
  tags:
  - Products
  operationId: createUserProduct
  summary: Create a user product
  description: >-
    The `id` is chosen by the client and can never be reused: posting an id that
    was used before answers 409, even after the product was deleted with
    DELETE /v22/user/products/{id}.
  responses:
    '204':
      description: Created
      content: {}
    '409':
      description: The id is already taken, or was used by a deleted product
      content: {}
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/UserProductDraft.yaml
get:
  tags:
  - Products
  operationId: listUserProducts
  summary: Products the user created
  responses:
    '200':
      description: ''
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
